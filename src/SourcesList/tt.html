<!DOCTYPE html>
<html>
<head>
<style>
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid black;
  padding: 15px;
  text-align: left;
  height: 5vh;
  width: 33vh;

  max-width: 200px; /* Set your desired maximum width here */
  max-height: 100px; /* Set your desired maximum height here */
  overflow: hidden; /* Hide any overflow text */
  white-space: nowrap; /* Prevent text from wrapping to the next line */
}

th {
  background-color: #f2f2f2;
}

.pagination {
  display: flex;
  justify-content: center;
  margin-top: 10px;
}

.pagination button {
  background-color: #4CAF50;
  color: white;
  padding: 14px 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}

.search-container {
  text-align: center;
  padding: 10px;
}

input[type=search] {
  width: 30%; /* Set your desired width here */
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}
</style>
</head>
<body>

<table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Email</th>
  </tr>
  <tr>
    <td>John</td>
    <td>Doe</td>
    <td>john@example.com</td>
  </tr>
  <tr>
    <td>Jane</td>
    <td>Doe</td>
    <td>jane@example.com</td>
  </tr>
  <!-- Add more rows as needed -->
</table>
<div class="search-container">
    <input type="search" placeholder="Search...">
</div>
<div class="pagination">
  <button>Previous</button>
  <button>1</button>
  <button>2</button>
  <button>3</button>
  <button>Next</button>
</div>

</body>
</html>
